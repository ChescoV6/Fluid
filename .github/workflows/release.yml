name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish single-file build
        run: dotnet publish -p:PublishSingleFile=true -p:CommitHash=${{ github.sha }} -p:CommitRef=${{ github.ref_type }}/${{ github.ref_name }} -r win-x64 -c Release --self-contained false .\Bloxstrap\Bloxstrap.csproj

      - name: Code sign (optional)
        if: env.SIGNING_CERT != ''
        shell: pwsh
        env:
          SIGNING_CERT: ${{ secrets.SIGNING_CERT }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          $certPath = "$env:RUNNER_TEMP\cert.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:SIGNING_CERT))
          & "signtool.exe" sign /f $certPath /p "$env:SIGNING_CERT_PASSWORD" /tr http://timestamp.digicert.com /td sha256 /fd sha256 ".\Bloxstrap\bin\Release\net8.0-windows\win-x64\publish\Fluid.exe"
          Remove-Item $certPath

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ./Bloxstrap/bin/Release/net8.0-windows/win-x64/publish/Fluid.exe
          generate_release_notes: true
